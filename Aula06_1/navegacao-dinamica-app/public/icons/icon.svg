<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Orbital Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="16 16" opacity="0.4" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.5" />
  <!-- Map Pin -->
  <path d="M256 120 C200 120 156 164 156 220 C156 295 256 392 256 392 C256 392 356 295 356 220 C356 164 312 120 256 120 Z" fill="url(#pin)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.5))" />
  <!-- Pin Center -->
  <circle cx="256" cy="220" r="38" fill="#ffffff" />
  <circle cx="256" cy="220" r="20" fill="#0f172a" />
  <!-- Crosshair ticks -->
  <line x1="256" y1="60" x2="256" y2="90" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="422" x2="256" y2="452" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="60" y1="256" x2="90" y2="256" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="422" y1="256" x2="452" y2="256" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
</svg>
