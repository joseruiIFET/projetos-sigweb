<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Coletor GPS SIG-Web</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
    }
    h1 { margin-top: 0; color: #38bdf8; font-size: 22px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.5; }
    .badge {
      display: inline-block;
      background: #0369a1;
      color: white;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Operação Offline</div>
    <h1>Você está desconectado da rede</h1>
    <p>O aplicativo continua apto a capturar dados do chip GNSS (satélites) no seu dispositivo móvel, mas as imagens do mapa de fundo requerem internet.</p>
  </div>
</body>
</html>
